name: Build and deploy Inkread
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm audit --audit-level=low
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-regression
          path: test-results/
          retention-days: 7
      - name: Package offline website
        run: cd dist && zip -r inkread-offline.zip .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  compatibility:
    # A local reusable workflow uses this run's commit and contributes to needs.
    uses: ./.github/workflows/compatibility.yml
  deploy:
    # Fail closed for every required job, including skipped/cancelled results.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.build.result == 'success' && needs.compatibility.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, compatibility]
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
