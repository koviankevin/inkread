name: Browser compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  library:
    name: Library (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      INKREAD_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
