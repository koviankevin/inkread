name: Affected browser tests
on:
  workflow_call:
    inputs:
      browsers:
        type: string
        required: true
      chromium:
        type: string
        required: true
      compatible:
        type: string
        required: true
permissions:
  contents: read
jobs:
  library:
    name: Selected (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size=1gb --user 1001
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
    env:
      INKREAD_BROWSER: ${{ matrix.browser }}
      INKREAD_TEST_SUITES: ${{ matrix.browser == 'chromium' && inputs.chromium || inputs.compatible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-selected.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
